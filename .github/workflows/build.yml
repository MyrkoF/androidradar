name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Clé de release (secrets du dépôt). Sans elle (fork, PR externe) l'APK sort non signé.
      - name: Restore release keystore
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests + build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          SHORT=$(git rev-parse --short HEAD)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NAME="radar-v${VERSION}-${SHORT}.apk"
          cp "$APK" "$NAME"
          cp "$APK" "radar-v${VERSION}.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: radar-release-apk
          path: ${{ steps.apk.outputs.name }}

      # Un push sur main compile et teste seulement (artefact). L'APK n'est publié que sur un tag vX.Y.Z,
      # quand tout ce qui était en cours est terminé (décision Myrko 2026-09-06) : "latest" = dernier tag.
      - name: Publish release (latest)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.apk.outputs.name }}" radar-latest.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest radar-latest.apk "${{ steps.apk.outputs.name }}" \
            --prerelease \
            --title "Radar v${{ steps.apk.outputs.version }} (${{ steps.apk.outputs.short }})" \
            --notes "Même APK que la release v${{ steps.apk.outputs.version }} — lien fixe. Télécharger, autoriser les sources inconnues, sideload."

      # Sur tag vX.Y.Z : release versionnée, celle que suivent F-Droid / IzzyOnDroid.
      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="fastlane/metadata/android/fr-FR/changelogs/${{ steps.apk.outputs.code }}.txt"
          [ -f "$NOTES" ] || { echo "Radar v${{ steps.apk.outputs.version }}" > /tmp/notes.txt; NOTES=/tmp/notes.txt; }
          gh release create "$GITHUB_REF_NAME" "radar-v${{ steps.apk.outputs.version }}.apk" \
            --title "Radar v${{ steps.apk.outputs.version }}" \
            --notes-file "$NOTES"
          # Ne garder que la dernière version publiée (décision Myrko 2026-09-06 : les anciennes polluent).
          for old in $(gh release list --json tagName --jq '.[].tagName' | grep '^v' | grep -v "^$GITHUB_REF_NAME$"); do
            gh release delete "$old" --yes --cleanup-tag || true
          done
