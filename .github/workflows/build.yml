name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHORT=$(git rev-parse --short HEAD)
          NAME="radar-v${VERSION}-${SHORT}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: radar-debug-apk
          path: ${{ steps.apk.outputs.name }}

      # Sur main : publie l'APK en Release "latest" (lien direct, stable, sans compte GitHub).
      # Le tag latest est recréé à chaque build. Les tags v* (releases manuelles) ne sont pas touchés.
      - name: Publish release (latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.apk.outputs.name }}" radar-latest.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest radar-latest.apk "${{ steps.apk.outputs.name }}" \
            --prerelease \
            --title "Radar v${{ steps.apk.outputs.version }} (${{ steps.apk.outputs.short }})" \
            --notes "Build automatique de main @ ${{ github.sha }}. Télécharger l'APK, autoriser les sources inconnues, sideload."
